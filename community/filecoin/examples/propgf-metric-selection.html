<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro PGF Metric Selection</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #fff; color: #1a1a1a; line-height: 1.5;
  max-width: 960px; margin: 0 auto; padding: 24px 20px;
}
h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
.subtitle { color: #666; font-size: 14px; margin-bottom: 24px; }

/* Project Selector */
.project-selector { margin-bottom: 24px; display: flex; align-items: center; gap: 12px; }
.project-selector select {
  font-size: 15px; padding: 8px 12px; border: 1px solid #d0d0d0;
  border-radius: 6px; background: #fff; min-width: 280px; cursor: pointer;
}
.entity-badge {
  display: inline-block; padding: 3px 10px; border-radius: 12px;
  font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
}
.entity-badge.onramp { background: #dbeafe; color: #1e40af; }
.entity-badge.sp_operator { background: #dcfce7; color: #166534; }
.entity-badge.infrastructure { background: #ffedd5; color: #9a3412; }
.entity-badge.ecosystem_support { background: #f3e8ff; color: #6b21a8; }
.entity-badge.unclassified { background: #f3f4f6; color: #4b5563; }
.batch-badge {
  display: inline-block; padding: 3px 10px; border-radius: 12px;
  font-size: 12px; font-weight: 600; letter-spacing: 0.5px;
}
.batch-badge.b1 { background: #e2e8f0; color: #475569; }
.batch-badge.b2 { background: #ccfbf1; color: #0f766e; }
.funded-label { font-size: 12px; color: #9ca3af; font-weight: 500; }

/* Selection Summary */
.selection-summary {
  display: flex; gap: 12px; margin-bottom: 28px;
}
.selection-slot {
  flex: 1; border: 2px dashed #e0e0e0; border-radius: 8px;
  padding: 12px; min-height: 80px; position: relative;
  display: flex; flex-direction: column; justify-content: center;
  transition: all 0.15s;
}
.selection-slot.filled {
  border: 2px solid #3b82f6; background: #f8faff;
}
.selection-slot .empty-text { color: #aaa; font-size: 13px; text-align: center; }
.selection-slot .slot-metric-name { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
.selection-slot .slot-meta { font-size: 11px; color: #666; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.selection-slot .slot-remove {
  position: absolute; top: 6px; right: 8px; cursor: pointer;
  background: none; border: none; font-size: 16px; color: #999;
  line-height: 1; padding: 2px;
}
.selection-slot .slot-remove:hover { color: #e11d48; }
.selection-slot .justification-input {
  margin-top: 6px; font-size: 12px; width: 100%; padding: 4px 6px;
  border: 1px solid #d0d0d0; border-radius: 4px;
}
.selection-counter {
  text-align: right; font-size: 13px; color: #666; margin-top: 6px; margin-bottom: 20px;
}
.selection-counter.full { color: #16a34a; font-weight: 600; }

/* KPI Sections */
.kpi-section { margin-bottom: 16px; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
.kpi-header {
  padding: 10px 14px; background: #f9fafb; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
  user-select: none; font-weight: 600; font-size: 14px;
}
.kpi-header:hover { background: #f3f4f6; }
.kpi-header .arrow { transition: transform 0.2s; font-size: 12px; color: #999; }
.kpi-header .arrow.open { transform: rotate(90deg); }
.kpi-header .metric-count { font-weight: 400; font-size: 12px; color: #999; margin-left: 8px; }
.kpi-body { display: none; }
.kpi-body.open { display: block; }

/* Metric Rows */
.metric-row {
  display: flex; align-items: center; padding: 8px 14px; gap: 10px;
  border-top: 1px solid #f0f0f0; cursor: pointer; transition: background 0.1s;
}
.metric-row:hover { background: #f8fafc; }
.metric-row.selected { background: #eff6ff; }
.metric-row.disabled { opacity: 0.45; cursor: default; }
.metric-row.disabled:hover { background: transparent; }
.metric-name { flex: 1; font-size: 13px; font-weight: 500; min-width: 0; }
.pill {
  display: inline-block; padding: 2px 8px; border-radius: 10px;
  font-size: 11px; font-weight: 500;
}
.pill.units { background: #f3f4f6; color: #4b5563; }
.pill.direct { background: #dcfce7; color: #166534; }
.pill.indirect { background: #fef3c7; color: #92400e; }
.pill.justification { background: #fef3c7; color: #92400e; font-size: 10px; }
.pill.nodata { background: #f3f4f6; color: #999; }
.source-col { width: 110px; flex-shrink: 0; text-align: center; }
.attr-col { width: 70px; flex-shrink: 0; text-align: center; }
.sparkline-container { width: 80px; height: 24px; flex-shrink: 0; }
.latest-value { width: 100px; flex-shrink: 0; font-size: 12px; color: #374151; text-align: right; font-variant-numeric: tabular-nums; }
.check-indicator {
  width: 20px; height: 20px; border-radius: 50%; border: 2px solid #d0d0d0;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  font-size: 12px; transition: all 0.15s;
}
.metric-row.selected .check-indicator {
  border-color: #3b82f6; background: #3b82f6; color: #fff;
}

/* Export Panel */
.export-panel {
  margin-top: 28px; padding: 16px; background: #f9fafb;
  border: 1px solid #e5e7eb; border-radius: 8px;
}
.export-panel h3 { font-size: 14px; margin-bottom: 12px; }
.btn {
  padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 500;
  cursor: pointer; border: 1px solid #d0d0d0; background: #fff; margin-right: 8px;
  transition: all 0.15s;
}
.btn:hover { background: #f3f4f6; }
.btn.primary { background: #3b82f6; color: #fff; border-color: #3b82f6; }
.btn.primary:hover { background: #2563eb; }
.copy-feedback { font-size: 12px; color: #16a34a; margin-left: 8px; display: none; }

/* Table View */
.table-view { margin-top: 16px; overflow-x: auto; display: none; }
.table-view table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table-view th, .table-view td {
  padding: 6px 10px; text-align: left; border-bottom: 1px solid #e5e7eb;
}
.table-view th { background: #f9fafb; font-weight: 600; font-size: 12px; text-transform: uppercase; color: #6b7280; }
.source-label {
  display: inline-block; padding: 2px 8px; border-radius: 10px;
  font-size: 11px; font-weight: 500; color: #6b7280; background: #e8eaed;
  white-space: nowrap; flex-shrink: 0;
}
.eval-period { font-size: 13px; color: #888; margin-bottom: 16px; }
</style>
</head>
<body>

<h1>Pro PGF Metric Selection</h1>
<p class="subtitle">Select up to 3 impact metrics your project wants to be measured against. Metrics are grouped by KPI and filtered to your project type.</p>

<div class="project-selector">
  <label for="project-select" style="font-weight:600;font-size:14px;">Project:</label>
  <select id="project-select"><option value="">Choose a project...</option></select>
  <span id="entity-badge"></span>
</div>

<div class="eval-period" id="eval-period" style="display:none;">Evaluation period: Feb – Apr 2026</div>
<div class="selection-summary" id="selection-slots"></div>
<div class="selection-counter" id="selection-counter"></div>

<div id="metric-sections"></div>

<div class="export-panel" id="export-panel" style="display:none;">
  <h3>Export Selections</h3>
  <button class="btn primary" id="btn-copy">Copy Selections as JSON</button>
  <button class="btn" id="btn-table">View as Table</button>
  <span class="copy-feedback" id="copy-feedback">Copied!</span>
  <div class="table-view" id="table-view"></div>
</div>

// State
let selectedProject = null;
let selectedGrant = null;
let selectedMetrics = []; // array of { metric_name, justification }
const MAX_SELECTIONS = 3;
const SOURCE_LABELS = {
  'github': 'GitHub',
  'client_verified': 'Data Portal',
  'sp_attribution': 'Data Portal',
  'filecoin_pay': 'Filecoin Pay',
  'warm_storage': 'Warm Storage',
  'survey_dependency': 'Survey + Data Portal',
};

const DEFAULT_SELECTIONS = {
  'onramp': ['client_onboarded_data_tibs', 'sp_block_rewards_fil', 'sp_count'],
  'sp_operator': ['sp_onboarded_data_tibs', 'sp_block_rewards_fil', 'sp_count'],

  'unclassified': ['downstream_entity_count', 'active_developers_28d', 'commits'],
};


// Helpers
function getEntityType(slug) { return DATA.entity_types[slug] || 'unclassified'; }

function getTimeseries(slug, metricName) {
  return DATA.timeseries
    .filter(r => r.oso_project_slug === slug && r.metric_name === metricName)
    .sort((a, b) => a.sample_date.localeCompare(b.sample_date));
}

function formatValue(v, units) {
  if (v === null || v === undefined) return '—';
  if (units === 'USD' || units === 'usd') return '$' + Number(v).toLocaleString(undefined, {maximumFractionDigits: 0});
  if (units === 'FIL' || units === 'fil') return Number(v).toLocaleString(undefined, {maximumFractionDigits: 1}) + ' FIL';
  if (units === 'TiB' || units === 'tib' || units === 'tibs') return Number(v).toLocaleString(undefined, {maximumFractionDigits: 2}) + ' TiB';
  if (units === 'percent' || units === '%' || units === 'pct') return Number(v).toLocaleString(undefined, {maximumFractionDigits: 2}) + '%';
  if (typeof v === 'number' && v >= 1000) return Number(v).toLocaleString(undefined, {maximumFractionDigits: 0});
  if (typeof v === 'number') return Number(v).toLocaleString(undefined, {maximumFractionDigits: 2});
  return String(v);
}

function makeSpark(ts) {
  if (!ts.length) return '';
  const vals = ts.map(r => r.amount);
  const mn = Math.min(...vals), mx = Math.max(...vals);
  const range = mx - mn || 1;
  const w = 80, h = 24, pad = 2;
  const points = vals.map((v, i) => {
    const x = pad + (i / Math.max(vals.length - 1, 1)) * (w - 2 * pad);
    const y = h - pad - ((v - mn) / range) * (h - 2 * pad);
    return x + ',' + y;
  }).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${points}" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function isSelected(metricName) {
  return selectedMetrics.some(s => s.metric_name === metricName);
}

function getAttribution(metricName, entityType) {
  const menu = DATA.metric_menu[metricName];
  if (!menu || !menu.attribution) return null;
  return menu.attribution[entityType] || null;
}

// Init project selector
function initProjectSelector() {
  const sel = document.getElementById('project-select');
  const batches = { 'Batch1': [], 'Batch2': [] };
  DATA.grants.forEach((g, idx) => {
    batches[g.batch].push({ ...g, idx });
  });
  ['Batch1', 'Batch2'].forEach(batch => {
    const label = batch === 'Batch1' ? 'Batch 1' : 'Batch 2';
    const group = document.createElement('optgroup');
    group.label = label;
    batches[batch].sort((a, b) => a.grant_name.localeCompare(b.grant_name));
    batches[batch].forEach(g => {
      const opt = document.createElement('option');
      opt.value = String(g.idx);
      if (g.oso_project_slug === null) {
        opt.textContent = g.grant_name + ' (no metrics data)';
        opt.disabled = true;
        opt.style.color = '#999';
      } else {
        opt.textContent = g.grant_name;
      }
      group.appendChild(opt);
    });
    sel.appendChild(group);
  });
  sel.addEventListener('change', () => {
    if (sel.value === '') {
      selectedProject = null;
      selectedGrant = null;
    } else {
      const grant = DATA.grants[parseInt(sel.value)];
      selectedGrant = grant;
      selectedProject = grant.oso_project_slug;
    }
    selectedMetrics = [];
    // Auto-select default metrics for this entity type
    if (selectedProject) {
      const et = getEntityType(selectedProject);
      const defaults = DEFAULT_SELECTIONS[et] || [];
      const projectMetricSet = new Set();
      DATA.timeseries.forEach(r => {
        if (r.oso_project_slug === selectedProject) projectMetricSet.add(r.metric_name);
      });
      defaults.forEach(mn => {
        if (projectMetricSet.has(mn) && selectedMetrics.length < MAX_SELECTIONS) {
          const menuInfo = DATA.metric_menu[mn];
          const isOther = !menuInfo || !(menuInfo.attribution && menuInfo.attribution[et] !== undefined);
          selectedMetrics.push({ metric_name: mn, justification: null, isOther: isOther });
        }
      });
    }
    render();
  });
}

// Render everything
function render() {
  renderBadge();
  renderSlots();
  renderSections();
  renderExport();
}

function renderBadge() {
  const el = document.getElementById('entity-badge');
  if (!selectedProject || !selectedGrant) { el.innerHTML = ''; document.getElementById('eval-period').style.display = 'none'; return; }
  const et = getEntityType(selectedProject);
  const batchClass = selectedGrant.batch === 'Batch1' ? 'b1' : 'b2';
  const batchLabel = selectedGrant.batch === 'Batch1' ? 'Batch 1' : 'Batch 2';
  const fundedStr = '$' + selectedGrant.total_amount.toLocaleString();
  el.innerHTML = `<span class="batch-badge ${batchClass}">${batchLabel}</span> <span class="entity-badge ${et}">${et.replace('_', ' ')}</span> <span class="funded-label">${fundedStr}</span>`;
  document.getElementById('eval-period').style.display = 'block';
}

function renderSlots() {
  const container = document.getElementById('selection-slots');
  let html = '';
  for (let i = 0; i < MAX_SELECTIONS; i++) {
    const sel = selectedMetrics[i];
    if (sel) {
      const cat = DATA.metric_catalog[sel.metric_name] || {};
      const et = getEntityType(selectedProject);
      const attr = getAttribution(sel.metric_name, et);
      const isOther = sel.isOther;
      const ts = getTimeseries(selectedProject, sel.metric_name);
      const latest = ts.length ? ts[ts.length - 1].amount : null;
      html += `<div class="selection-slot filled">
        <button class="slot-remove" data-idx="${i}">&times;</button>
        <div class="slot-metric-name">${cat.metric_display_name || sel.metric_name}</div>
        <div class="slot-meta">
          <span class="pill units">${cat.metric_units || ''}</span>
          ${attr ? `<span class="pill ${attr}">${attr.toUpperCase()}</span>` : ''}
          ${latest !== null ? `<span>${formatValue(latest, cat.metric_units)}</span>` : ''}
        </div>
        ${isOther ? `<input class="justification-input" placeholder="Justification required..." value="${sel.justification || ''}" data-idx="${i}">` : ''}
      </div>`;
    } else {
      html += `<div class="selection-slot"><span class="empty-text">Select a metric</span></div>`;
    }
  }
  container.innerHTML = html;

  // Bind remove buttons
  container.querySelectorAll('.slot-remove').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.idx);
      selectedMetrics.splice(idx, 1);
      render();
    });
  });

  // Bind justification inputs
  container.querySelectorAll('.justification-input').forEach(inp => {
    inp.addEventListener('input', () => {
      const idx = parseInt(inp.dataset.idx);
      selectedMetrics[idx].justification = inp.value;
    });
  });

  // Counter
  const counter = document.getElementById('selection-counter');
  const n = selectedMetrics.length;
  counter.textContent = `${n}/${MAX_SELECTIONS} selected`;
  counter.className = 'selection-counter' + (n === MAX_SELECTIONS ? ' full' : '');
}

function renderSections() {
  const container = document.getElementById('metric-sections');
  if (!selectedProject) { container.innerHTML = '<p style="color:#999;font-size:14px;">Select a project to see available metrics.</p>'; return; }

  const et = getEntityType(selectedProject);

  // Categorize metrics
  const kpiGroups = { 1: [], 2: [], 3: [], 0: [] };
  const otherMetrics = [];

  // All metrics that have data for this project
  const projectMetrics = new Set();
  DATA.timeseries.forEach(r => {
    if (r.oso_project_slug === selectedProject) projectMetrics.add(r.metric_name);
  });

  // Menu metrics for this entity type
  const menuMetricsForType = new Set();
  Object.entries(DATA.metric_menu).forEach(([mn, info]) => {
    const cat = DATA.metric_catalog[mn] || {};
    const src = cat.metric_event_source;
    if (src === 'funding_events' || src === 'private_funding') return;
    if (info.attribution && info.attribution[et] !== undefined) {
      menuMetricsForType.add(mn);
      const kpi = info.kpi;
      const hasData = projectMetrics.has(mn);
      kpiGroups[kpi].push({ metric_name: mn, hasData });
    }
  });

  // Other: has data but not in menu for this entity type
  projectMetrics.forEach(mn => {
    if (!menuMetricsForType.has(mn)) {
      const cat = DATA.metric_catalog[mn] || {};
      const src = cat.metric_event_source;
      if (src === 'funding_events' || src === 'private_funding') return;
      otherMetrics.push({ metric_name: mn, hasData: true });
    }
  });

  // Sort each group
  Object.values(kpiGroups).forEach(arr => arr.sort((a, b) => a.metric_name.localeCompare(b.metric_name)));
  otherMetrics.sort((a, b) => a.metric_name.localeCompare(b.metric_name));

  const kpiLabels = {
    1: 'KPI 1: Drive Paid Onchain Deals',
    2: 'KPI 2: Strengthen Network Profitability',
    3: 'KPI 3: Scale Flagship Client Adoption',
    0: 'Developer Activity'
  };

  let html = '';
  [1, 2, 3, 0].forEach(kpi => {
    const items = kpiGroups[kpi];
    const availCount = items.filter(m => m.hasData).length;
    const defaultOpen = availCount > 0;
    html += renderSection(kpiLabels[kpi], items, defaultOpen, false, et);
  });

  if (otherMetrics.length) {
    html += renderSection('Other Metrics', otherMetrics, false, true, et);
  }

  container.innerHTML = html;

  // Bind collapsible headers
  container.querySelectorAll('.kpi-header').forEach(hdr => {
    hdr.addEventListener('click', () => {
      const body = hdr.nextElementSibling;
      const arrow = hdr.querySelector('.arrow');
      body.classList.toggle('open');
      arrow.classList.toggle('open');
    });
  });

  // Bind metric rows
  container.querySelectorAll('.metric-row:not(.disabled)').forEach(row => {
    row.addEventListener('click', () => {
      const mn = row.dataset.metric;
      const isOther = row.dataset.other === 'true';
      if (isSelected(mn)) {
        selectedMetrics = selectedMetrics.filter(s => s.metric_name !== mn);
      } else if (selectedMetrics.length < MAX_SELECTIONS) {
        selectedMetrics.push({ metric_name: mn, justification: null, isOther });
      }
      render();
    });
  });
}

function renderSection(title, items, defaultOpen, isOther, et) {
  const availCount = items.filter(m => m.hasData).length;
  let html = `<div class="kpi-section">
    <div class="kpi-header">
      <span><span class="arrow ${defaultOpen ? 'open' : ''}">&#9654;</span> ${title}<span class="metric-count">${availCount} metric${availCount !== 1 ? 's' : ''} available</span></span>
    </div>
    <div class="kpi-body ${defaultOpen ? 'open' : ''}">`;

  items.forEach(item => {
    const mn = item.metric_name;
    const cat = DATA.metric_catalog[mn] || {};
    const ts = getTimeseries(selectedProject, mn);
    const latest = ts.length ? ts[ts.length - 1].amount : null;
    const sel = isSelected(mn);
    const disabled = !item.hasData;
    const attr = getAttribution(mn, et);

    const srcLabel = SOURCE_LABELS[cat.metric_event_source] || '';
    let attrHtml = '';
    if (attr) attrHtml = `<span class="pill ${attr}">${attr.toUpperCase()}</span>`;
    if (isOther && !disabled) attrHtml += `<span class="pill justification">REQUIRES JUSTIFICATION</span>`;

    html += `<div class="metric-row ${sel ? 'selected' : ''} ${disabled ? 'disabled' : ''}" data-metric="${mn}" data-other="${isOther}">
      <div class="check-indicator">${sel ? '&#10003;' : ''}</div>
      <span class="metric-name">${cat.metric_display_name || mn}</span>
      <span class="source-col">${srcLabel ? `<span class="source-label">${srcLabel}</span>` : ''}</span>
      <span class="attr-col">${attrHtml}</span>
      <span class="sparkline-container">${disabled ? '' : makeSpark(ts)}</span>
      <span class="latest-value">${disabled ? '<span class="pill nodata">No data</span>' : formatValue(latest, cat.metric_units)}</span>
    </div>`;
  });

  html += `</div></div>`;
  return html;
}

function renderExport() {
  const panel = document.getElementById('export-panel');
  panel.style.display = selectedProject && selectedMetrics.length > 0 ? 'block' : 'none';
  document.getElementById('table-view').style.display = 'none';
}

function buildExportJSON() {
  const et = getEntityType(selectedProject);
  return {
    grant_name: selectedGrant ? selectedGrant.grant_name : null,
    batch: selectedGrant ? selectedGrant.batch : null,
    funded_amount: selectedGrant ? selectedGrant.total_amount : null,
    oso_project_slug: selectedProject,
    entity_type: et,
    selected_at: new Date().toISOString().slice(0, 10),
    selections: selectedMetrics.map(sel => {
      const cat = DATA.metric_catalog[sel.metric_name] || {};
      const ts = getTimeseries(selectedProject, sel.metric_name);
      const latest = ts.length ? ts[ts.length - 1].amount : null;
      const attr = getAttribution(sel.metric_name, et);
      return {
        metric_name: sel.metric_name,
        metric_display_name: cat.metric_display_name || sel.metric_name,
        metric_units: cat.metric_units || null,
        attribution_method: attr || null,
        justification: sel.justification || null,
        latest_value: latest,
        timeseries: ts.map(r => ({ date: r.sample_date, value: r.amount }))
      };
    })
  };
}

// Copy button
document.getElementById('btn-copy').addEventListener('click', () => {
  const json = JSON.stringify(buildExportJSON(), null, 2);
  navigator.clipboard.writeText(json).then(() => {
    const fb = document.getElementById('copy-feedback');
    fb.style.display = 'inline';
    setTimeout(() => fb.style.display = 'none', 2000);
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = JSON.stringify(buildExportJSON(), null, 2);
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    const fb = document.getElementById('copy-feedback');
    fb.style.display = 'inline';
    setTimeout(() => fb.style.display = 'none', 2000);
  });
});

// Table button
document.getElementById('btn-table').addEventListener('click', () => {
  const tv = document.getElementById('table-view');
  if (tv.style.display === 'block') { tv.style.display = 'none'; return; }
  const exp = buildExportJSON();
  let html = '<table><thead><tr><th>metric_name</th><th>metric_display_name</th><th>metric_units</th><th>attribution_method</th><th>date</th><th>value</th></tr></thead><tbody>';
  exp.selections.forEach(sel => {
    if (sel.timeseries.length) {
      sel.timeseries.forEach(pt => {
        html += `<tr><td>${sel.metric_name}</td><td>${sel.metric_display_name}</td><td>${sel.metric_units || ''}</td><td>${sel.attribution_method || ''}</td><td>${pt.date}</td><td>${pt.value}</td></tr>`;
      });
    } else {
      html += `<tr><td>${sel.metric_name}</td><td>${sel.metric_display_name}</td><td>${sel.metric_units || ''}</td><td>${sel.attribution_method || ''}</td><td>—</td><td>—</td></tr>`;
    }
  });
  html += '</tbody></table>';
  tv.innerHTML = html;
  tv.style.display = 'block';
});

// Init
initProjectSelector();
render();
</script>
</body>
</html>
